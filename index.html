<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamid Coach</title>
<meta name="description" content="Daily training, nutrition and peptide log with a live dashboard, backed by the Hamid Coach Google Sheet.">
<meta name="theme-color" content="#0B0F17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0B0F17; --bg2:#0E1420; --surface:#141B28; --elev:#1B2434; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#E8EEF8; --muted:#8B98AD; --dim:#5E6B80;
  --teal:#2DD4BF; --violet:#8B5CF6; --blue:#60A5FA; --green:#34D399; --amber:#FBBF24; --red:#F87171; --pink:#F472B6;
  --grad:linear-gradient(135deg,#2DD4BF 0%,#8B5CF6 100%);
  --radius:22px; --radius-s:14px; --pad:16px;
  --nav-h:calc(64px + env(safe-area-inset-bottom));
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{background:radial-gradient(900px 500px at 20% -10%,rgba(139,92,246,.18),transparent 60%),radial-gradient(700px 400px at 100% 0%,rgba(45,212,191,.14),transparent 55%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--teal)}
#app{min-height:100%;padding-bottom:var(--nav-h)}
.screen{display:none;padding:calc(env(safe-area-inset-top) + 40px) var(--pad) 24px;max-width:560px;margin:0 auto}
.screen.active{display:block;animation:fade .28s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 14px}
.hdr h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.hdr .sub{color:var(--muted);font-size:14px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--elev);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.teal{color:#0B0F17;background:var(--teal);border-color:transparent}
.chip.violet{color:#fff;background:var(--violet);border-color:transparent}
.chip.ok{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.10)}
.chip.watch{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.10)}
.chip.action{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--elev);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .15s var(--ease)}
.iconbtn:active{transform:scale(.92)}
/* cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero{background:linear-gradient(135deg,rgba(45,212,191,.16),rgba(139,92,246,.18)),var(--surface);border-color:rgba(139,92,246,.25)}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big small{font-size:16px;color:var(--muted);font-weight:600;margin-left:4px}
.delta{font-weight:700;font-size:14px}
.delta.down{color:var(--green)}.delta.up{color:var(--amber)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:13px}.xs{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
/* rings */
.ring{position:relative;width:66px;height:66px;margin:0 auto}
.ring svg{transform:rotate(-90deg);width:66px;height:66px}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:-.02em;line-height:1.1}
.ring .val span{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.ringlbl{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
/* inputs */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--radius-s);padding:13px 14px;font-size:17px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--teal)}
.inp.num{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.inline{display:flex;gap:10px}
.inline .field{flex:1}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-weight:600}
.rel{position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:var(--radius-s);font-weight:800;font-size:16px;background:var(--elev);border:1px solid var(--line2);color:var(--text);transition:transform .12s var(--ease),filter .12s;width:100%}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.primary{background:var(--grad);color:#0B0F17;border-color:transparent;box-shadow:0 10px 24px rgba(139,92,246,.28)}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:12px}
.btn.danger{color:var(--red);border-color:rgba(248,113,113,.35)}
.btn[disabled]{opacity:.5;pointer-events:none}
/* toggles */
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);font-weight:700;font-size:14px;transition:all .15s var(--ease);text-align:left;color:var(--muted)}
.tg .dot{width:22px;height:22px;border-radius:8px;border:2px solid var(--dim);display:inline-flex;align-items:center;justify-content:center;flex:none;transition:all .15s}
.tg.on{color:var(--text);background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.45)}
.tg.on .dot{background:var(--teal);border-color:var(--teal);color:#0B0F17}
.tg.warn.on{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.45)}
.tg.warn.on .dot{background:var(--amber);border-color:var(--amber)}
.tg:active{transform:scale(.97)}
/* segmented */
.seg{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--elev);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .s{font-size:13px;color:var(--muted)}
.ex{padding:14px;border-radius:18px;background:var(--bg2);border:1px solid var(--line2);margin-bottom:10px}
.ex.done{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.06)}
.ex .name{font-weight:800;font-size:15px;line-height:1.25}
.ex .plan{font-size:12.5px;color:var(--muted);margin-top:3px}
.ex .prev{font-size:12px;color:var(--teal);margin-top:4px;font-weight:600}
.ex .inputs{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
.ex .inputs .inp{padding:10px 8px;text-align:center;font-size:16px;font-weight:700}
.ex .inputs label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;display:block;text-align:center;margin-bottom:3px}
.ex.core .name{color:var(--amber)}
.bar{height:10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .5s var(--ease)}
.bar.warn i{background:linear-gradient(90deg,#FBBF24,#F87171)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.kv b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.status{padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;line-height:1.3;margin-bottom:8px;border:1px solid var(--line)}
.status.ok{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.3);color:#A7F3D0}
.status.watch{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.35);color:#FDE68A}
.status.action{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4);color:#FECACA}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pill.ok{background:rgba(52,211,153,.15);color:var(--green)}.pill.watch{background:rgba(251,191,36,.15);color:var(--amber)}.pill.action{background:rgba(248,113,113,.15);color:var(--red)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.tbl th{color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
canvas{max-width:100%}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);background:rgba(14,20,32,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.02em;transition:color .15s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--teal)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.open{display:flex}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .28s var(--ease);max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.handle{width:42px;height:5px;border-radius:999px;background:var(--line2);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px);transform:translateX(-50%) translateY(20px);background:var(--elev);border:1px solid var(--line2);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:all .25s var(--ease);z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(248,113,113,.5);color:#FECACA}
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--elev) 37%,var(--bg2) 63%);background-size:400% 100%;animation:sh 1.2s infinite;border-radius:10px;height:14px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.site{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.site button{padding:10px 6px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--muted)}
.site button.on{border-color:var(--violet);color:#fff;background:rgba(139,92,246,.18)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;padding:10px 12px;border-radius:14px;background:var(--elev);border:1px solid var(--line2);font-size:13px;font-weight:700;text-align:left;max-width:200px}
.quick button small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:2px}
.sync{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);z-index:25;font-size:11px;font-weight:700;color:var(--muted);background:rgba(14,20,32,.7);backdrop-filter:blur(8px);padding:5px 9px;border-radius:999px;border:1px solid var(--line)}
.sync.off{color:var(--amber)}.sync.busy{color:var(--teal)}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datenav .d{font-weight:800;font-size:16px}
.setup{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 30px) var(--pad) 40px}
.setup .logo{width:84px;height:84px;border-radius:24px;margin:0 auto 18px;display:block;box-shadow:0 18px 40px rgba(139,92,246,.35)}
.step{display:flex;gap:12px;margin-bottom:14px}
.step .n{width:28px;height:28px;border-radius:999px;background:var(--grad);color:#0B0F17;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
code{background:var(--bg2);padding:2px 6px;border-radius:6px;font-size:13px;color:var(--teal)}
.item.rt{cursor:pointer;gap:10px}.item.rt .dot{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0B0F17;flex:none;transition:all .15s}.item.rt.on .dot{background:var(--teal);border-color:var(--teal)}.item.rt.on .t{color:var(--teal)}
</style>
</head>
<body>
<div id="sync" class="sync">…</div>
<div id="app"></div>

<nav id="nav">
  <button data-go="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-go="log"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>Log</button>
  <button data-go="train"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button data-go="food"><svg viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 2-3 5-3 8h3v10"/></svg>Food</button>
  <button data-go="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/></svg>Progress</button>
</nav>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="vendor/chart-4.5.1.umd.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
